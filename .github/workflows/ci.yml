name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: gofmt -l .
      - run: go build ./...
      - name: documented configs validate
        run: |
          export EPMON_API_KEY=ci-dummy TOKEN=ci-dummy DEV_TOKEN=ci-dummy
          python3 - <<'EOF'
          import os, re, subprocess, tempfile
          blocks = re.findall(r'```yaml\n(.*?)```', open('README.md').read(), re.S)
          assert blocks, "no yaml blocks found in README"
          for i, b in enumerate(blocks):
              with tempfile.NamedTemporaryFile('w', suffix='.yaml', delete=False) as f:
                  f.write(b)
                  path = f.name
              r = subprocess.run(['go', 'run', './cmd/epmon', 'validate', '--config', path],
                                 capture_output=True, text=True)
              print(f"README yaml block {i}: exit={r.returncode} {r.stderr.strip()}")
              os.unlink(path)
              if r.returncode != 0:
                  raise SystemExit(f"README yaml block {i} failed to validate")
          EOF
          go run ./cmd/epmon validate --config config.example.yaml
          go run ./cmd/epmon validate --config config.example.json
      - run: go vet ./...
      - run: go test -race ./...
