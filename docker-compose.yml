services:
  epmon:
    build:
      context: .
      args:
        # Export these before composing, e.g.
        # VERSION=$(git describe --tags --always --dirty) \
        # COMMIT=$(git rev-parse --short HEAD) \
        # DATE=$(date -u +%FT%TZ) docker compose up --build -d
        VERSION: "${VERSION:-dev}"
        COMMIT: "${COMMIT:-unknown}"
        DATE: "${DATE:-unknown}"
    container_name: epmon
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data:rw
      # mount your catalogue at ./data/config.yaml (or edit the path below)
    environment:
      TZ: "UTC"
